services:
  - type: web
    name: ai-phone-02-team-room
    runtime: docker
    plan: free
    dockerfilePath: ./services/ai-team-room/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: TEAM_ROOM_BIND
        value: 0.0.0.0:10000
      - key: DATABASE_URL
        fromDatabase:
          name: ai-phone-02-postgres
          property: connectionString
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false

  - type: web
    name: ai-phone-02-agent
    runtime: docker
    plan: free
    dockerfilePath: ./services/ai-phone-02-agent/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_PHONE_EXECUTOR_TOKEN
        generateValue: true
      - key: AI_PHONE_MODEL
        value: gpt-6-luna
      - key: AI_PHONE_SYSTEM_PROMPT
        sync: false

  # Render Free does not support Background Worker instances.
  # The worker is therefore exposed as a Web Service so it can run the
  # same persistent polling loop while the service is awake.
  - type: web
    name: ai-phone-02-worker
    runtime: docker
    plan: free
    dockerfilePath: ./services/ai-phone-02-worker/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: AI_PHONE_API_URL
        sync: false
      - key: AI_PHONE_SESSION_TOKEN
        sync: false
      - key: AI_PHONE_ENDPOINT_CREDENTIAL
        sync: false
      - key: AI_PHONE_ID
        sync: false
      - key: AI_PHONE_REPLY_TO_ID
        sync: false
      - key: AI_PHONE_EXECUTOR_URL
        sync: false
      - key: AI_PHONE_EXECUTOR_TOKEN
        sync: false
      - key: AI_PHONE_POLL_MS
        value: "2000"
      - key: AI_PHONE_HEARTBEAT_MS
        value: "30000"

databases:
  - name: ai-phone-02-postgres
    plan: free
