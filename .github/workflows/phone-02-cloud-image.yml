name: AI-PHONE-02 Cloud Image

on:
  push:
    branches:
      - mission/remote-contact-tablet-first
  pull_request:
    branches:
      - v2-saas-alpha
      - mission/remote-contact-tablet-first

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build hosted tablet + Team Room image
        run: docker build -f services/ai-team-room/Dockerfile -t ai-phone-02-team-room:ci .
      - name: Build independent Phone-02 AI executor image
        run: docker build -f services/ai-phone-02-agent/Dockerfile -t ai-phone-02-agent:ci .
      - name: Build persistent Phone-02 worker image
        run: docker build -f services/ai-phone-02-worker/Dockerfile -t ai-phone-02-worker:ci .
      - name: Verify image exists
        run: docker image inspect ai-phone-02-team-room:ci >/dev/null
